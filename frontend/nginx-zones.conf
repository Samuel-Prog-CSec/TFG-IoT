# /frontend/nginx-zones.conf
# Definiciones globales (zones) que requieren contexto `http` en nginx.
# Se copia a `/etc/nginx/conf.d/00-zones.conf` para garantizar carga ANTES de
# `default.conf`. El nginx.conf base del image nginx:alpine ya tiene
# `include /etc/nginx/conf.d/*.conf` dentro del bloque http, por lo que
# estas directivas se interpretan en contexto http como requiere la spec.
#
# T-905 B4: rate limit edge antes de tocar al backend Koyeb.
# Defense in depth complementaria a express-rate-limit del backend.

# Zone para /api/*. 20 req/s por IP normalizada IPv4/IPv6.
# Burst tolerada en el location: 40 (= 2s de tráfico permitido en ráfaga sin demoras).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Zone para /socket.io/* — más laxa porque cada conexión legítima genera
# múltiples requests durante el handshake/upgrade.
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;
