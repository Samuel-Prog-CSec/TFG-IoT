  <!-- Chip -->
  <rect x="8.5" y="10" width="6" height="4.5" rx="1.2" fill="#7c3aed" opacity="0.35"/>
  <!-- Onda de señal (cercana) -->
  <path d="M23 12.5a5 5 0 010 7" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Onda de señal (lejana) -->
  <path d="M26.2 9.5a9.5 9.5 0 010 13" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
