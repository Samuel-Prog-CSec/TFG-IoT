<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Card shadow -->
  <rect x="6" y="8.5" width="14" height="18" rx="2" fill="#4c1d95" opacity="0.3"/>
  <!-- RFID Card -->
  <rect x="5" y="7" width="14" height="18" rx="2" fill="white"/>
  <!-- Card chip -->
  <rect x="8" y="10.5" width="5" height="3.5" rx="0.8" fill="#8b5cf6" opacity="0.25"/>
  <!-- RFID signal wave (close) -->
  <path d="M22 12.5a4.5 4.5 0 010 7" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- RFID signal wave (far) -->
  <path d="M25.5 9.5a8 8 0 010 13" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
</svg>
