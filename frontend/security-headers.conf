# /frontend/security-headers.conf
# Cabeceras de seguridad compartidas para el SPA servido por Nginx.
#
# Se incluye EXPLÍCITAMENTE en cada `location` que defina su propio `add_header`
# (p. ej. la de cache de assets estáticos): en Nginx, `add_header` NO se hereda
# del bloque padre hacia un `location` hijo que ya tiene algún `add_header`
# propio. Sin este include, los `.js`/`.css`/`.svg` se servían SIN cabeceras de
# seguridad —en particular sin `X-Content-Type-Options: nosniff`— porque la
# location anidada de cache rompía la herencia (footgun clásico de Nginx).
#
# `X-XSS-Protection: 0` (no `1; mode=block`): la guía moderna (OWASP Secure
# Headers, MDN) recomienda DESACTIVAR el auditor XSS legacy del navegador —que
# tuvo sus propias vulnerabilidades— y confiar en la CSP. Alineado con el
# `helmet` del backend, que ya emite `X-XSS-Protection: 0`.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(self)" always;
# CSP sincronizada con la política prod de helmet en el backend. scriptSrc sin
# 'unsafe-inline'/'unsafe-eval' (vector XSS principal). report-uri → /api/csp-report.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.sentry.io https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.sentry.io https://challenges.cloudflare.com ws: wss:; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report" always;
