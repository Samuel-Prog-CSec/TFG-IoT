# /frontend/nginx.conf
# Configuración de Nginx para SPA React + Proxy API
# Autor: Samuel Blanchart Pérez
# Versión: 1.0.0

server {
    listen 80;
    server_name _;

    # ==========================================
    # Seguridad del servidor
    # ==========================================
    server_tokens off;
    client_max_body_size 10m;

    # ==========================================
    # Compresión Gzip
    # ==========================================
    gzip on;
    # gzip_static sirve los .gz que Vite pre-genera en el build (vite-plugin-
    # compression2) en lugar de recomprimir al vuelo: mejor ratio y cero CPU en
    # runtime. Si no existe el .gz correspondiente, cae al gzip on-the-fly de
    # abajo. El módulo ngx_http_gzip_static_module viene en la imagen oficial
    # nginx:alpine (verificado: `nginx -V` muestra --with-http_gzip_static_module).
    # Brotli (.br, también generado por Vite) queda pendiente: nginx:alpine no
    # incluye ngx_brotli; requeriría una imagen con el módulo compilado.
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    gzip_comp_level 6;

    # Cabeceras de seguridad: se aplican SOLO en las locations que sirven el SPA
    # (location / y la de assets), NO a nivel server. Así las respuestas proxied
    # de /api y /socket.io llevan ÚNICAMENTE las cabeceras del backend (helmet),
    # sin duplicar CSP/nosniff/etc. (el backend es la fuente autoritativa para la API).

    # ==========================================
    # Health Check Endpoint
    # ==========================================
    # Coincidencia EXACTA (`=`), no prefijo: un `location /health` (sin `=`)
    # también matchearía `/health/ready` y `/health/live`, tapando esas rutas
    # con este "OK" estático y dejando el smoke test de los workflows de deploy
    # sin validar nunca el backend real (ver documentation/Deploy_VPS.md §6).
    # Esta location es solo para el healthcheck del contenedor Docker
    # (docker-compose.yml, servicio frontend); las rutas reales de negocio
    # (/api/health/ready) las sirve el proxy de más abajo.
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ==========================================
    # 1. Servir el Frontend (Vite SPA)
    # ==========================================
    location / {
        # Cabeceras de seguridad sobre el documento HTML del SPA.
        include /etc/nginx/snippets/security-headers.conf;

        # `index.html` (y el fallback SPA) NO debe cachearse. Tras cortar un
        # deploy nuevo, los chunks JS llevan hash en el nombre (immutable, 1y),
        # pero el HTML que los referencia debe revalidarse SIEMPRE para que el
        # navegador recoja el bundle nuevo. Sin esto el navegador reutilizaba el
        # index.html de caché y seguía ejecutando el chunk anterior tras el
        # deploy. `no-cache` = cachea pero revalida (304 si no
        # cambió). Va como `add_header` al mismo nivel que el include de
        # seguridad: ambos acumulan en `location /`; la sub-location de assets
        # define los suyos propios y conserva `immutable`.
        add_header Cache-Control "no-cache" always;

        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            # Re-incluir las cabeceras de seguridad: al definir `add_header`
            # (Cache-Control) aquí, Nginx deja de heredar las del bloque server,
            # así que sin este include los assets perderían `nosniff` y el resto.
            include /etc/nginx/snippets/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ==========================================
    # 2. Proxy para el Backend (API REST)
    # T-905 B4: rate limit edge antes de pasar al backend Koyeb.
    # Defense in depth: backend tiene su propio rate limiter, este es el primer gate.
    # burst=40 tolera ráfagas legítimas (uploads, paginación rápida) sin demoras.
    # ==========================================
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # ==========================================
    # 3. Proxy para WebSockets (Socket.io)
    # T-905 B4: rate limit más laxa (10r/s) para WS — un upgrade puede generar
    # 3-5 requests durante handshake polling-then-upgrade.
    # ==========================================
    location /socket.io/ {
        limit_req zone=ws_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================
    # Página de error personalizada
    # ==========================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}