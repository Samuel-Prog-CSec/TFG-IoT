name: Sentry Release (sourcemaps)

# Sube los sourcemaps del frontend a Sentry para que las trazas de errores en
# producción muestren código fuente legible en lugar del bundle minificado.
#
# Trigger: workflow_dispatch (manual) por defecto, para que pueda activarse
# sólo cuando Sentry esté listo y `SENTRY_AUTH_TOKEN` + `SENTRY_ORG_SLUG`
# estén en GitHub Secrets. Cuando todo esté operativo, descomentar el
# trigger `on.push.tags` para que dispare automáticamente con cada release.
#
# Pre-requisitos:
# - SENTRY_AUTH_TOKEN (scope project:releases) en Secrets.
# - SENTRY_ORG_SLUG en Secrets.
# - vars.SENTRY_RELEASE_ENABLED = "true" para activar el job.
#
# Frontend YA emite sourcemaps en modo `hidden` (ver `frontend/vite.config.js`,
# ADR-159) — Sentry los consume sin que se expongan al cliente.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (ej. v1.0.0). Si vacío, usa el último tag."
        required: false
        type: string
  # Descomentar tras el primer smoke test manual:
  # push:
  #   tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: sentry-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"
  # Pin exacto de @sentry/cli para reducir superficie supply-chain. Subir
  # a una versión nueva tras smoke test manual local.
  SENTRY_CLI_VERSION: "2.58.5"

jobs:
  upload-sourcemaps:
    name: Build + upload sourcemaps a Sentry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Salta el workflow si los secrets aún no están configurados — evita
    # fallar runs antes de que el operador haya completado el bootstrap de Sentry.
    if: ${{ vars.SENTRY_RELEASE_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determinar versión a publicar
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install sentry-cli pinned
        working-directory: frontend
        # Instalación única en frontend/node_modules para evitar 4 descargas
        # con npx y para fijar la versión exacta. --no-save no toca package.json.
        run: npm install --no-save "@sentry/cli@${{ env.SENTRY_CLI_VERSION }}"

      - name: Build frontend (con sourcemaps hidden)
        working-directory: frontend
        env:
          # Build de production igual que el deploy real.
          VITE_APP_ENV: production
        run: npm run build

      - name: Crear release Sentry
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG_SLUG }}
          SENTRY_PROJECT: eduplay-frontend
        run: |
          npx sentry-cli releases new "${{ steps.version.outputs.version }}"
          npx sentry-cli releases set-commits "${{ steps.version.outputs.version }}" --auto

      - name: Upload sourcemaps frontend
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG_SLUG }}
          SENTRY_PROJECT: eduplay-frontend
        run: |
          npx sentry-cli releases files "${{ steps.version.outputs.version }}" \
            upload-sourcemaps dist \
            --rewrite \
            --url-prefix '~/'

      - name: Finalizar release Sentry
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG_SLUG }}
          SENTRY_PROJECT: eduplay-frontend
        run: |
          npx sentry-cli releases finalize "${{ steps.version.outputs.version }}"

      - name: Borrar sourcemaps locales tras subida
        # Higiene: los sourcemaps están en `frontend/dist/` con extensión `.map`
        # y NO deben servirse desde Cloudflare Pages (config `sourcemap: 'hidden'`
        # ya impide referenciarlos desde el bundle, pero los archivos físicos
        # podrían quedar accesibles si Pages los publica). Borrarlos tras la
        # subida cierra la puerta a curiosos.
        run: |
          find frontend/dist -name '*.map' -delete || true
