name: Dependency Review

# Analiza el diff de dependencias del PR contra la base branch.
# Bloquea PRs que:
#   - introducen deps con vulnerabilidades de severidad >= 'moderate'
#   - introducen licencias prohibidas (GPL, AGPL — incompatibles con MIT)
#
# Complementa a npm audit + dependabot: audit corre nocturno y dependabot
# crea PRs, pero un PR humano que añade `npm install <pkg>` con vulns nuevas
# sólo lo captura este workflow.
#
# Docs: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review

on:
  pull_request:
    branches: [main, develop, Maintenance]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Cualquier vuln moderate o mayor introducida en el PR falla el check.
          # 'low' es ruidoso; 'high' deja pasar moderates que son frecuentes.
          fail-on-severity: moderate
          # Licencias permitidas (open-source compatibles con MIT/Apache).
          # Si necesitas añadir una, justifícalo en el PR description.
          # NOTA: dependency-review-action v4 considera mutuamente excluyentes
          # `allow-licenses` y `deny-licenses`. Usamos allowlist (más estricto):
          # cualquier licencia no listada aquí — incluidas las copyleft fuertes
          # como GPL-2.0/3.0, AGPL-*, LGPL-3.0, EUPL-1.2 y MPL-2.0 — falla el PR.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense, Python-2.0, BlueOak-1.0.0
          # Excepciones puntuales por paquete: el detector de licencias de esta
          # action confunde archivos auxiliares del repo con la licencia real.
          # Verificado contra el campo `license` publicado en npm (autoritativo):
          # - @apidevtools/json-schema-ref-parser@14.2.1 → MIT (detector reporta "JSON AND MIT")
          # - glob@7.1.6 (transitivo de swagger-jsdoc) → ISC (detector reporta "CC-BY-SA-4.0 AND ISC")
          allow-dependencies-licenses: pkg:npm/%40apidevtools/json-schema-ref-parser@14.2.1, pkg:npm/glob@7.1.6
          # Comentar el resumen en el PR para visibilidad rápida.
          comment-summary-in-pr: on-failure
          # Permitir advisories ya documentados como no alcanzables en build.yml
          # (ver comentarios en el step "Security gate (producción)"). Mantener
          # esta lista sincronizada con BACKEND_EXCLUDED + FRONTEND_EXCLUDED.
          allow-ghsas: GHSA-58qx-3vcg-4xpx
