name: Preview Deploy

# Crea un servicio Koyeb efímero por cada PR para facilitar la review del
# backend ante cambios significativos. El frontend ya tiene preview deploys
# automáticos vía Cloudflare Pages (no requiere workflow).
#
# Por defecto el workflow está deshabilitado vía la variable `PREVIEW_DEPLOYS_ENABLED`
# (repo variable, NO secret) — los preview deploys consumen cuota del free
# tier de Koyeb. Activar sólo cuando se haya migrado a un plan de pago.
#
# Para activarlo: repo Settings → Secrets and variables → Actions →
# Variables → Repository variables → New: `PREVIEW_DEPLOYS_ENABLED=true`.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, Maintenance, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Crear/actualizar preview para PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      vars.PREVIEW_DEPLOYS_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verificar secrets requeridos
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          KOYEB_ORG: ${{ secrets.KOYEB_ORG }}
        run: |
          set -e
          for var in KOYEB_API_TOKEN KOYEB_ORG; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var no está configurado"
              exit 1
            fi
          done
          echo "Todos los secrets están presentes"

      - name: Instalar Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Crear o actualizar servicio efímero
        id: deploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          KOYEB_ORG: ${{ secrets.KOYEB_ORG }}
        run: |
          set -e
          PR_NUM="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.event.pull_request.head.ref }}"
          APP_NAME="api-pr-$PR_NUM"

          # Si ya existe, redeploy; si no, create.
          # El CLI Koyeb lee KOYEB_TOKEN del entorno automáticamente; no pasarlo
          # en argv evita que aparezca en `ps`/audit logs del runner.
          if koyeb services get "$APP_NAME" >/dev/null 2>&1; then
            echo "Servicio $APP_NAME ya existe — redeploy"
            koyeb services redeploy "$APP_NAME"
          else
            echo "Creando servicio $APP_NAME desde la rama $BRANCH"
            # NOTA: variables de entorno mínimas se asumen heredadas del template
            # de Koyeb o configuradas vía koyeb services env si fuera necesario.
            # La preview comparte BD staging (read-mostly).
            koyeb services create "$APP_NAME" \
              --git github.com/${{ github.repository }} \
              --git-branch "$BRANCH" \
              --git-workdir backend \
              --git-build-command "npm ci" \
              --git-run-command "npm run start:prod" \
              --port 5000:http \
              --route /:5000 \
              --instance-type eco \
              --region fra
          fi

          URL="https://${APP_NAME}-${KOYEB_ORG}.koyeb.app"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Comentar URL en el PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          APP_NAME: ${{ steps.deploy.outputs.app_name }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const app = process.env.APP_NAME;
            const body = `🚀 **Preview backend desplegada**\n\n` +
              `- Servicio Koyeb: \`${app}\`\n` +
              `- URL: ${url}\n` +
              `- Health: ${url}/health/ready\n\n` +
              `_Comparte la BD de staging (read-mostly). Se destruirá al cerrar el PR._`;
            // Buscar comentario previo para actualizar en vez de duplicar
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('🚀 **Preview backend'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  teardown:
    name: Destruir preview al cerrar PR
    runs-on: ubuntu-latest
    if: >-
      vars.PREVIEW_DEPLOYS_ENABLED == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Verificar secrets requeridos
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          set -e
          if [ -z "$KOYEB_API_TOKEN" ]; then
            echo "::error::Secret KOYEB_API_TOKEN no está configurado"
            exit 1
          fi

      - name: Instalar Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"

      - name: Eliminar servicio efímero
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          # KOYEB_TOKEN viene por env — no se pasa --token en argv para no
          # exponerlo en `ps`/audit logs del runner.
          PR_NUM="${{ github.event.pull_request.number }}"
          APP_NAME="api-pr-$PR_NUM"
          if koyeb services get "$APP_NAME" >/dev/null 2>&1; then
            echo "Eliminando $APP_NAME"
            koyeb services delete "$APP_NAME"
          else
            echo "Servicio $APP_NAME ya no existe — nada que limpiar"
          fi
