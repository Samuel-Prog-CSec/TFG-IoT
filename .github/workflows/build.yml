name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, Maintenance]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "documentation/**"
      - "development/**"
      - "rfid_scanner/**"
      - ".github/skills/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, Maintenance]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "documentation/**"
      - "development/**"
      - "rfid_scanner/**"
      - ".github/skills/**"
      - "LICENSE"

# Cancela runs anteriores del mismo PR/branch para no desperdiciar resources
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.0"

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint (backend + frontend en paralelo)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias (root + backend + frontend)
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Lint backend
        run: npm run lint
        working-directory: ./backend

      - name: Lint frontend
        run: npm run lint
        working-directory: ./frontend

  # ──────────────────────────────────────────────
  # Job 2: Security audit
  # ──────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Security gate (producción)
        # La lógica de filtrado vive en backend/scripts/audit-with-exclusions.js
        # (con tests en backend/tests/auditWithExclusions.test.js). Aquí solo
        # mantenemos el catálogo legible de exclusiones documentadas y los
        # invocamos por workspace. Cualquier cambio en la política se hace
        # editando el JS + tests, no inline en el workflow.
        run: |
          set -e

          # ───── Backend ─────
          # Exclusiones documentadas (no alcanzables en nuestra cadena de dependencias):
          # - GHSA-w5hq-g745-h8pq: uuid <14.0.0 buffer bounds check en v3/v5/v6 cuando se pasa `buf`.
          #   Único consumidor transitivo es bullmq, que solo invoca uuid.v4() sin `buf`.
          #   No podemos forzar uuid@14+ via overrides: v12 eliminó soporte CommonJS y bullmq (CJS)
          #   fallaría en runtime. A la espera de que bullmq actualice su peer deps.
          # - GHSA-v2v4-37r5-5v8g: ip-address <=10.1.0 XSS en métodos Address6 HTML-emitting.
          #   Único consumidor transitivo es express-rate-limit@8.4.1 (rango vulnerable 8.0.1-8.5.0).
          #   express-rate-limit usa ip-address para parsear/normalizar IPv6 al /64 (helper interno),
          #   nunca invoca los métodos HTML-emitting. Fix upstream en express-rate-limit@8.5.1+,
          #   bloqueado actualmente por el date-lock de npm en el snapshot del proyecto.
          # - GHSA-jxxr-4gwj-5jf2: brace-expansion 5.0.2-5.0.5 DoS por rango numérico grande.
          #   Solo se usa en transitivas de devtools (glob, jest, mocha) y nunca recibe input
          #   de usuario en runtime. Pendiente: subir override a ">=5.0.6" en próximo Dependabot.
          # - GHSA-58qx-3vcg-4xpx: ws 8.0.0-8.20.0 uninitialized memory disclosure en parsing
          #   de fragmentos malformados. Consumidores transitivos: socket.io@4.8.3 → ws@8.20.0,
          #   engine.io, socket.io-adapter. Fix disponible (ws 8.20.1+) pero requiere bump de
          #   socket.io. Mitigación operativa: socket.io exige JWT válido antes de aceptar
          #   mensajes, reduciendo superficie. Pendiente: override "ws":">=8.20.1" en ventana
          #   de mantenimiento dedicada (no bloquear cierre de cloud foundation).
          BACKEND_EXCLUDED="GHSA-w5hq-g745-h8pq,GHSA-v2v4-37r5-5v8g,GHSA-jxxr-4gwj-5jf2,GHSA-58qx-3vcg-4xpx"
          node backend/scripts/audit-with-exclusions.js \
            --workspace backend \
            --label "Backend" \
            --excluded "$BACKEND_EXCLUDED"

          # ───── Frontend ─────
          # axios fijado a 1.14.0 (última versión pre-supply-chain-attack).
          # Las siguientes advisories solo afectan Node.js server-side, no browsers:
          # - GHSA-3p68-rc4w-qgx5: axios SSRF via NO_PROXY bypass
          # - GHSA-fvcv-3m26-pcqx: axios Cloud Metadata Exfiltration via Header Injection
          # - GHSA-r4q5-vmmm-2653: follow-redirects filtra cabeceras auth en redirects cross-domain
          # - GHSA-58qx-3vcg-4xpx: ws (transitivo via engine.io-client). Mismo análisis que en
          #   el backend: no alcanzable en browser cliente, fix en socket.io-client ≥4.8.4.
          FRONTEND_EXCLUDED="GHSA-3p68-rc4w-qgx5,GHSA-fvcv-3m26-pcqx,GHSA-r4q5-vmmm-2653,GHSA-58qx-3vcg-4xpx"
          node backend/scripts/audit-with-exclusions.js \
            --workspace frontend \
            --label "Frontend" \
            --excluded "$FRONTEND_EXCLUDED"

      - name: Security report (completo)
        run: npm run audit:all
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Job 3: Tests backend (requiere MongoDB)
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias backend
        run: npm ci
        working-directory: ./backend

      - name: Ejecutar tests
        run: npm test
        working-directory: ./backend
        env:
          JWT_SECRET: "test_secret"
          MONGODB_URI: "mongodb://localhost:27017/rfid_games_test"

      - name: Normalizar rutas LCOV para SonarCloud
        if: always()
        run: |
          if [ -f backend/coverage/lcov.info ]; then
            sed -i 's#^SF:src/#SF:backend/src/#' backend/coverage/lcov.info
            echo "--- Backend LCOV path samples ---"
            grep '^SF:' backend/coverage/lcov.info | head -3 || true
          fi

      - name: Subir cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Job 4: Tests + build frontend
  # ──────────────────────────────────────────────
  frontend-checks:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        run: npm ci
        working-directory: ./frontend

      - name: Ejecutar tests con cobertura
        working-directory: ./frontend
        run: |
          # Node 24 + tinypool: worker crash (ERR_WORKER_OUT_OF_MEMORY) al terminar
          # produce exit code 1 aunque todos los tests hayan pasado.
          # Capturamos la salida y verificamos que no hay tests fallidos reales.
          set +e
          npm run test:coverage 2>&1 | tee vitest-output.txt
          EXIT_CODE=$?
          set -e

          # Si exit code es 0, todo bien
          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          fi

          # Si hay tests que realmente fallaron, falla el step
          if grep -qE "Tests.*failed" vitest-output.txt; then
            echo "❌ Tests reales fallaron"
            exit 1
          fi

          # Si todos los tests pasaron pero el worker crasheó al terminar, es OK
          if grep -qE "Tests.*passed" vitest-output.txt; then
            echo "⚠️  Worker crash post-tests (Node 24 + tinypool known issue) — tests passed"
            exit 0
          fi

          # Caso desconocido: fallar por seguridad
          echo "❌ No se pudo determinar el resultado de los tests"
          exit 1

      - name: Normalizar rutas LCOV para SonarCloud
        if: always()
        run: |
          if [ -f frontend/coverage/lcov.info ]; then
            sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info
            echo "--- Frontend LCOV path samples ---"
            grep '^SF:' frontend/coverage/lcov.info | head -3 || true
          fi

      - name: Subir cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

      - name: Verificar build de producción
        run: npm run build
        working-directory: ./frontend
        env:
          NODE_ENV: production

      - name: Bundle size budget
        # Umbrales en KB. Si el bundle frontend crece por encima, el CI falla.
        # Ajustar aquí cuando se añadan dependencias grandes con justificación.
        #
        # MAX_DIST_KB: total del directorio dist/ EXCLUYENDO artefactos secundarios
        #   (sourcemaps .map, pre-compresiones .gz/.br generadas por vite-plugin-compression).
        #   Mide lo que realmente se sirve al usuario: HTML, CSS, JS, fuentes, imágenes.
        # MAX_JS_GZIP_KB: suma del gzip on-the-fly de cada .js — la métrica que
        #   más impacta el tiempo de carga real para el usuario.
        env:
          MAX_DIST_KB: 6144       # 6 MB total (sin sourcemaps/pre-compresiones)
          MAX_JS_GZIP_KB: 900     # 900 KB gzipped (JS chunks) — actual ~600 KB tras T-907
        run: |
          set -e
          cd frontend/dist

          # Tamaño total del dist en KB, excluyendo sourcemaps y pre-compresiones.
          # Los .gz/.br son alternativos al original (no se sirven además), y los .map
          # se eliminan antes del deploy (sentry-release.yml hace find -name '*.map' -delete).
          DIST_KB=$(find . -type f ! -name "*.map" ! -name "*.gz" ! -name "*.br" -printf '%s\n' | awk '{s+=$1} END {print int((s+1023)/1024)}')

          # JS gzipped: sumamos el size gzipped de cada .js bajo assets/
          # gzip -c imprime a stdout, wc -c cuenta bytes, dividimos a KB.
          JS_GZIP_BYTES=0
          while IFS= read -r -d '' f; do
            BYTES=$(gzip -c "$f" | wc -c)
            JS_GZIP_BYTES=$((JS_GZIP_BYTES + BYTES))
          done < <(find . -type f -name "*.js" -print0)
          JS_GZIP_KB=$((JS_GZIP_BYTES / 1024))

          echo "### Bundle Size Budget (frontend)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor actual | Umbral | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          FAILED=0

          if [ "$DIST_KB" -gt "$MAX_DIST_KB" ]; then
            echo "| dist/ total | ${DIST_KB} KB | ${MAX_DIST_KB} KB | ❌ Excede |" >> $GITHUB_STEP_SUMMARY
            echo "::error::frontend/dist es de ${DIST_KB} KB (umbral ${MAX_DIST_KB} KB)"
            FAILED=1
          else
            PCT=$((DIST_KB * 100 / MAX_DIST_KB))
            echo "| dist/ total | ${DIST_KB} KB | ${MAX_DIST_KB} KB | ✅ ${PCT}% del budget |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$JS_GZIP_KB" -gt "$MAX_JS_GZIP_KB" ]; then
            echo "| JS gzipped | ${JS_GZIP_KB} KB | ${MAX_JS_GZIP_KB} KB | ❌ Excede |" >> $GITHUB_STEP_SUMMARY
            echo "::error::JS bundle gzipped ${JS_GZIP_KB} KB (umbral ${MAX_JS_GZIP_KB} KB)"
            FAILED=1
          else
            PCT=$((JS_GZIP_KB * 100 / MAX_JS_GZIP_KB))
            echo "| JS gzipped | ${JS_GZIP_KB} KB | ${MAX_JS_GZIP_KB} KB | ✅ ${PCT}% del budget |" >> $GITHUB_STEP_SUMMARY
          fi

          # Top 10 archivos más pesados (sin gzip) para investigación rápida.
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Top 10 archivos más pesados</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -type f \( -name "*.js" -o -name "*.css" -o -name "*.woff2" \) -exec du -k {} + | sort -rn | head -10 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Si el aumento es justificado (nueva librería pesada), sube los umbrales en \`.github/workflows/build.yml\` con justificación en el PR." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Job 5: SonarCloud (informativo, no bloquea CI)
  # ──────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    needs: [backend-tests, frontend-checks]
    permissions:
      contents: read
    # Ejecutar en push y en PRs internos; excluir bots.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Descargar cobertura backend
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Descargar cobertura frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Validar disponibilidad de SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN no esta configurado para este contexto de ejecucion." >&2
          echo "Configura el secret SONAR_TOKEN (token de SonarCloud con Execute Analysis)." >&2
          exit 1

      - name: SonarCloud Scan
        id: sonar_scan
        uses: sonarsource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Resumen SonarCloud
        if: always()
        run: |
          echo "## SonarCloud Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.sonar_scan.outcome }}" = "success" ]; then
            echo "> **Estado:** Analisis completado" >> $GITHUB_STEP_SUMMARY
          else
            echo "> **Estado:** Analisis con problemas (no bloquea CI)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Resultados detallados en [SonarCloud](https://sonarcloud.io/project/overview?id=Samuel-Prog-CSec_TFG-IoT)" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Job 6: Reporte de calidad (cobertura visible en todas las ramas)
  # ──────────────────────────────────────────────
  quality-report:
    name: Quality Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-tests, frontend-checks]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Descargar cobertura backend
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/coverage
        continue-on-error: true

      - name: Descargar cobertura frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true

      - name: Generar resumen de cobertura
        run: |
          echo "## Reporte de Cobertura" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          parse_lcov() {
            local file="$1"
            local name="$2"
            if [ ! -f "$file" ]; then
              echo "| $name | - | - | Sin datos |" >> $GITHUB_STEP_SUMMARY
              return
            fi
            local lh=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' "$file")
            local lf=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' "$file")
            if [ "$lf" -eq 0 ]; then
              echo "| $name | 0 | 0 | 0% |" >> $GITHUB_STEP_SUMMARY
              return
            fi
            local pct=$((lh * 100 / lf))
            local icon="🔴"
            [ "$pct" -ge 40 ] && icon="🟡"
            [ "$pct" -ge 60 ] && icon="🟢"
            echo "| $name | $lh | $lf | $icon **${pct}%** |" >> $GITHUB_STEP_SUMMARY
          }

          echo "| Modulo | Lineas cubiertas | Lineas totales | Cobertura |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------------|----------------|-----------|" >> $GITHUB_STEP_SUMMARY
          parse_lcov "backend/coverage/lcov.info" "Backend"
          parse_lcov "frontend/coverage/lcov.info" "Frontend"
          echo "" >> $GITHUB_STEP_SUMMARY

          # Resumen de jobs anteriores
          echo "### Estado de Jobs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests & Build | ${{ needs.frontend-checks.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Coverage gate
        # Umbrales mínimos de cobertura. Si bajan, el job (y por tanto el CI) falla.
        # Ajustar aquí cuando se introduzcan tests nuevos masivos (subir baseline)
        # o cuando se decida relajar (ej. refactor masivo en sprint específico).
        #
        # No correr si los tests originales fallaron — sólo evaluamos cobertura
        # sobre runs verdes (no queremos doble-fallar el CI por la misma causa).
        if: needs.backend-tests.result == 'success' && needs.frontend-checks.result == 'success'
        env:
          BACKEND_MIN_COVERAGE: 50
          FRONTEND_MIN_COVERAGE: 30
        run: |
          set -e

          compute_pct() {
            local file="$1"
            if [ ! -f "$file" ]; then
              echo "missing"
              return
            fi
            local lh=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' "$file")
            local lf=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' "$file")
            if [ "$lf" -eq 0 ]; then
              echo "0"
              return
            fi
            echo $((lh * 100 / lf))
          }

          BACKEND_PCT=$(compute_pct "backend/coverage/lcov.info")
          FRONTEND_PCT=$(compute_pct "frontend/coverage/lcov.info")

          echo "### Coverage Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Workspace | Cobertura | Umbral mínimo | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----------|---------------|--------|" >> $GITHUB_STEP_SUMMARY

          FAILED=0

          if [ "$BACKEND_PCT" = "missing" ]; then
            echo "| Backend | sin LCOV | ${BACKEND_MIN_COVERAGE}% | ⚠️ Sin datos |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BACKEND_PCT" -lt "$BACKEND_MIN_COVERAGE" ]; then
            echo "| Backend | ${BACKEND_PCT}% | ${BACKEND_MIN_COVERAGE}% | ❌ Por debajo |" >> $GITHUB_STEP_SUMMARY
            echo "::error::Backend coverage ${BACKEND_PCT}% < ${BACKEND_MIN_COVERAGE}% (umbral mínimo)"
            FAILED=1
          else
            echo "| Backend | ${BACKEND_PCT}% | ${BACKEND_MIN_COVERAGE}% | ✅ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FRONTEND_PCT" = "missing" ]; then
            echo "| Frontend | sin LCOV | ${FRONTEND_MIN_COVERAGE}% | ⚠️ Sin datos |" >> $GITHUB_STEP_SUMMARY
          elif [ "$FRONTEND_PCT" -lt "$FRONTEND_MIN_COVERAGE" ]; then
            echo "| Frontend | ${FRONTEND_PCT}% | ${FRONTEND_MIN_COVERAGE}% | ❌ Por debajo |" >> $GITHUB_STEP_SUMMARY
            echo "::error::Frontend coverage ${FRONTEND_PCT}% < ${FRONTEND_MIN_COVERAGE}% (umbral mínimo)"
            FAILED=1
          else
            echo "| Frontend | ${FRONTEND_PCT}% | ${FRONTEND_MIN_COVERAGE}% | ✅ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Sube la cobertura añadiendo tests o ajusta el umbral en \`.github/workflows/build.yml\` con justificación." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
