name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, Maintenance]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "documentation/**"
      - "development/**"
      - "rfid_scanner/**"
      - ".github/skills/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, Maintenance]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "documentation/**"
      - "development/**"
      - "rfid_scanner/**"
      - ".github/skills/**"
      - "LICENSE"

# Cancela runs anteriores del mismo PR/branch para no desperdiciar resources
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.0"

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint (backend + frontend en paralelo)
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias (root + backend + frontend)
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Lint backend
        run: npm run lint
        working-directory: ./backend

      - name: Lint frontend
        run: npm run lint
        working-directory: ./frontend

  # ──────────────────────────────────────────────
  # Job 2: Security audit
  # ──────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Security gate (producción)
        run: npm run audit:prod

      - name: Security report (completo)
        run: npm run audit:all
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Job 3: Tests backend (requiere MongoDB)
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias backend
        run: npm ci
        working-directory: ./backend

      - name: Ejecutar tests
        run: npm test
        working-directory: ./backend
        env:
          JWT_SECRET: "test_secret"
          MONGODB_URI: "mongodb://localhost:27017/rfid_games_test"

      - name: Normalizar rutas LCOV para SonarCloud
        if: always()
        run: |
          if [ -f backend/coverage/lcov.info ]; then
            sed -i 's#^SF:src/#SF:backend/src/#' backend/coverage/lcov.info
            echo "--- Backend LCOV path samples ---"
            grep '^SF:' backend/coverage/lcov.info | head -3 || true
          fi

      - name: Subir cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Job 4: Tests + build frontend
  # ──────────────────────────────────────────────
  frontend-checks:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        run: npm ci
        working-directory: ./frontend

      - name: Ejecutar tests con cobertura
        working-directory: ./frontend
        run: |
          # Node 24 + tinypool: worker crash (ERR_WORKER_OUT_OF_MEMORY) al terminar
          # produce exit code 1 aunque todos los tests hayan pasado.
          # Capturamos la salida y verificamos que no hay tests fallidos reales.
          set +e
          npm run test:coverage 2>&1 | tee vitest-output.txt
          EXIT_CODE=$?
          set -e

          # Si exit code es 0, todo bien
          if [ $EXIT_CODE -eq 0 ]; then
            exit 0
          fi

          # Si hay tests que realmente fallaron, falla el step
          if grep -qE "Tests.*failed" vitest-output.txt; then
            echo "❌ Tests reales fallaron"
            exit 1
          fi

          # Si todos los tests pasaron pero el worker crasheó al terminar, es OK
          if grep -qE "Tests.*passed" vitest-output.txt; then
            echo "⚠️  Worker crash post-tests (Node 24 + tinypool known issue) — tests passed"
            exit 0
          fi

          # Caso desconocido: fallar por seguridad
          echo "❌ No se pudo determinar el resultado de los tests"
          exit 1

      - name: Normalizar rutas LCOV para SonarCloud
        if: always()
        run: |
          if [ -f frontend/coverage/lcov.info ]; then
            sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info
            echo "--- Frontend LCOV path samples ---"
            grep '^SF:' frontend/coverage/lcov.info | head -3 || true
          fi

      - name: Subir cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

      - name: Verificar build de producción
        run: npm run build
        working-directory: ./frontend
        env:
          NODE_ENV: production

  # ──────────────────────────────────────────────
  # Job 5: SonarCloud (depende de tests backend + frontend)
  # ──────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-tests, frontend-checks]
    permissions:
      contents: read
    # Ejecutar en push y en PRs internos; excluir bots.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Descargar cobertura backend
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Descargar cobertura frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Validar disponibilidad de SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN no esta configurado para este contexto de ejecucion." >&2
          echo "Configura el secret SONAR_TOKEN (token de SonarCloud con Execute Analysis)." >&2
          exit 1

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v7
        with:
          args: >-
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
