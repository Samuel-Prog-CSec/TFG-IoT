; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
	miguelbalboa/MFRC522@^1.4.10

; T-905 B8: secret HMAC inyectado en build-time desde la env var del operador.
; Generar con: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
; Ejemplo de invocación: RFID_HMAC_SECRET=abcdef... pio run
; La inyección se hace en un pre-script (inject_hmac_secret.py) porque PlatformIO
; NO soporta la expansión condicional de bash (${VAR:+...}) en build_flags: la
; sustituye literalmente y rompe el parseo. El script define el macro SOLO si la
; env var existe; si no, queda el stub del main.cpp (el backend lo rechazará
; cuando RFID_HMAC_ENABLED=true — forzando provisionar antes de prod).
extra_scripts = pre:inject_hmac_secret.py
