; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
	miguelbalboa/MFRC522@^1.4.10

; T-905 B8: secret HMAC inyectado en build-time desde la env var del operador.
; Generar con: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
; Ejemplo invocación: RFID_HMAC_SECRET=abcdef... pio run
; Si la env var no está definida, queda el stub del main.cpp (backend rechazará
; cuando RFID_HMAC_ENABLED=true — forzando provisionado correcto antes de prod).
build_flags =
	${sysenv.RFID_HMAC_SECRET:+-DRFID_HMAC_SECRET="\"${sysenv.RFID_HMAC_SECRET}\""}
