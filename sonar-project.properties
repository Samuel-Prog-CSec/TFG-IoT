sonar.projectKey=Samuel-Prog-CSec_TFG-IoT
sonar.organization=samuel-github-projects


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=TFG-IoT
sonar.projectVersion=0.5.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=backend,frontend

# Tests y cobertura
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/__tests__/**,frontend/src/**/*.test.{js,jsx}
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
# Cobertura: excluimos lo que no tiene logica testeable con unit tests
# (bootstrap, configs, scripts CLI, barrel files, iconos/efectos visuales, constantes).
# Asi la metrica "Coverage on New Code" refleja el codigo de negocio real.
sonar.coverage.exclusions=**/*.config.{js,mjs,cjs},**/eslint.config.js,**/vite.config.js,**/vitest.config.js,**/jest.config.js,**/tests/**,**/__tests__/**,**/*.test.{js,jsx,ts,tsx},**/*.spec.{js,jsx,ts,tsx},**/test/setup.js,**/main.jsx,**/App.jsx,**/server.js,**/index.js,backend/scripts/**,backend/src/scripts/lua/**,backend/src/config/**,frontend/src/lib/sentry.js,frontend/src/constants/**,frontend/src/components/icons/**,frontend/src/components/effects/**,frontend/src/assets/**

# Duplicacion: excluimos ficheros con patrones estructurales repetitivos por naturaleza
# (schemas Mongoose, validators Zod, variantes UI con className/motion).
sonar.cpd.exclusions=**/tests/**,**/__tests__/**,**/*.test.{js,jsx},**/*.spec.{js,jsx},**/seeders/**,backend/src/models/**,backend/src/validators/**,frontend/src/components/ui/**

sonar.newCode.referenceBranch=main

# Reglas suprimidas por decisión arquitectónica (ver Architecture_Decisions.md).
# ─────────────────────────────────────────────────────────────────────────
# S6774 (PropTypes should be defined): el proyecto usa JS plano sin PropTypes ni
# TypeScript (ver CLAUDE.md: "No usamos TypeScript"). Aplicar la regla exigiria
# mantener PropTypes en ~200 .jsx sin beneficio runtime; la validacion de entrada
# se hace en la frontera del backend con Zod.
#
# S3776 (Cognitive Complexity): Suprimido puntualmente en componentes/servicios
# orquestadores donde la complejidad es inherente al dominio (paginas principales
# con multiples widgets y filtros, gestores stateful de hardware RFID, servicios
# Redis con branches defensivas y fallbacks). Dos de ellos (Dashboard, ChallengeDisplay)
# ya tienen eslint-disable local con justificacion. El resto comparten el mismo
# patron: orquestacion UI/state con muchos estados reales, no complejidad accidental.
sonar.issue.ignore.multicriteria=noproptypes,cog1,cog2,cog3,cog4,cog5,cog6,cog7,cog8,cog9
sonar.issue.ignore.multicriteria.noproptypes.ruleKey=javascript:S6774
sonar.issue.ignore.multicriteria.noproptypes.resourceKey=**/*.jsx
sonar.issue.ignore.multicriteria.cog1.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog1.resourceKey=frontend/src/pages/Dashboard.jsx
sonar.issue.ignore.multicriteria.cog2.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog2.resourceKey=frontend/src/pages/GameSession.jsx
sonar.issue.ignore.multicriteria.cog3.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog3.resourceKey=frontend/src/pages/ContextsPage.jsx
sonar.issue.ignore.multicriteria.cog4.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog4.resourceKey=frontend/src/components/game/ChallengeDisplay.jsx
sonar.issue.ignore.multicriteria.cog5.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog5.resourceKey=frontend/src/components/game/FeedbackOverlay.jsx
sonar.issue.ignore.multicriteria.cog6.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog6.resourceKey=frontend/src/components/ui/RFIDConnector.jsx
sonar.issue.ignore.multicriteria.cog7.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog7.resourceKey=frontend/src/components/ui/RFIDScannerPanel.jsx
sonar.issue.ignore.multicriteria.cog8.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog8.resourceKey=frontend/src/components/ui/SelectPremium.jsx
sonar.issue.ignore.multicriteria.cog9.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.cog9.resourceKey=backend/src/services/redisService.js

# Desactivar análisis C/C++/ObjC (evita el sensor CFamily y el requisito compile_commands)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Carpetas fuera del analisis: dependencias, builds, docs, memoria TFG, assets, notas de desarrollo.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.scannerwork/**,rfid_scanner/**,**/seeders/**,**/docs/**,**/logs/**,**/assets/**,memoria/**,development/**,documentation/**,frontend/public/**,**/*.md

# No esperar al quality gate — el scanner sube resultados pero no falla si el gate no pasa.
# El CI usa continue-on-error como segunda capa de protección.
sonar.qualitygate.wait=false

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8