# Desactivar análisis C/C++/ObjC (evita el sensor CFamily y el requisito compile_commands)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Carpetas fuera del analisis: dependencias, builds, docs, memoria TFG, assets, notas de desarrollo.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/.scannerwork/**,rfid_scanner/**,**/seeders/**,**/docs/**,**/logs/**,**/assets/**,memoria/**,development/**,documentation/**,frontend/public/**,**/*.md

# No esperar al quality gate — el scanner sube resultados pero no falla si el gate no pasa.
# El CI usa continue-on-error como segunda capa de protección.
sonar.qualitygate.wait=false

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8