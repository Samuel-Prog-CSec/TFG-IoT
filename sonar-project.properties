sonar.projectKey=Samuel-Prog-CSec_TFG-IoT
sonar.organization=samuel-github-projects


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=TFG-IoT
sonar.projectVersion=0.5.1


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=backend,frontend

# Tests y cobertura
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/__tests__/**,frontend/src/**/*.test.{js,jsx}
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
# Cobertura: excluimos lo que no tiene logica testeable con unit tests
# (bootstrap, configs, scripts CLI, barrel files, iconos/efectos visuales, constantes).
# Asi la metrica "Coverage on New Code" refleja el codigo de negocio real.
sonar.coverage.exclusions=**/*.config.{js,mjs,cjs},**/eslint.config.js,**/vite.config.js,**/vitest.config.js,**/jest.config.js,**/tests/**,**/__tests__/**,**/*.test.{js,jsx,ts,tsx},**/*.spec.{js,jsx,ts,tsx},**/test/setup.js,**/main.jsx,**/App.jsx,**/server.js,**/index.js,backend/scripts/**,backend/src/scripts/lua/**,backend/src/config/**,frontend/src/lib/sentry.js,frontend/src/constants/**,frontend/src/components/icons/**,frontend/src/components/effects/**,frontend/src/assets/**

# Duplicacion: excluimos ficheros con patrones estructurales repetitivos por naturaleza
# (schemas Mongoose, validators Zod, variantes UI con className/motion).
sonar.cpd.exclusions=**/tests/**,**/__tests__/**,**/*.test.{js,jsx},**/*.spec.{js,jsx},**/seeders/**,backend/src/models/**,backend/src/validators/**,frontend/src/components/ui/**

sonar.newCode.referenceBranch=main

# Reglas suprimidas por decisión arquitectónica (ver Architecture_Decisions.md).
# ─────────────────────────────────────────────────────────────────────────
# S6774 (PropTypes should be defined): el proyecto usa JS plano sin PropTypes ni
# TypeScript (ver CLAUDE.md: "No usamos TypeScript"). Aplicar la regla exigiria
# mantener PropTypes en ~200 .jsx sin beneficio runtime; la validacion de entrada
# se hace en la frontera del backend con Zod.
#
# S3776 (Cognitive Complexity): Suprimido puntualmente en componentes/servicios
# orquestadores donde la complejidad es inherente al dominio (paginas principales
# con multiples widgets y filtros, gestores stateful de hardware RFID, servicios
# Redis con branches defensivas y fallbacks, motores de juego que coordinan
# timers/persistencia/realtime, scripts CLI con multiples flags y validaciones).
# Comparten el patron: orquestacion con muchos estados reales, no complejidad
# accidental. Refactorizar a sub-funciones dispersaria el flujo y empeoraria la
# legibilidad. Decision arquitectonica documentada en Architecture_Decisions.md.
#
# S6819 (Use native element instead of role): Suprimido en archivos donde el
# elemento nativo no encaja con el diseno: ilustraciones SVG inline (role="img"
# con <title>/aria-label es el patron WAI-ARIA correcto, no <img>), barras de
# progreso con CSS animation custom (no expresable con <progress> nativo sin
# perder la animacion), dropzones que envuelven inputs file (los <button> no
# pueden anidar contenido interactivo segun HTML spec) y combobox con autocompletado
# (no expresable con <select> multiple).
sonar.issue.ignore.multicriteria=noproptypes,cog1,cog2,cog3,cog4,cog5,cog6,cog7,cog8,cog9,cog10,cog11,cog12,cog13,cog14,cog15,cog16,cog17,cog18,cog19,cog20,cog21,cog22,cog23,cog24,cog25,cog26,cog27,cog28,cog29,role1,role2,role3,role4,role5,role6,role7,role8,role9,role10,role11
sonar.issue.ignore.multicriteria.noproptypes.ruleKey=javascript:S6774
